<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts. Programs that ask for a kind of font rather than a font by name —
  Alacritty, Firefox, web pages, most of GTK — get the ones enso draws with.
-->
<fontconfig>
  <!--
    First, the families named in enso/config.toml (Google Sans Flex and
    Google Sans Code), with Symbols Nerd Font behind them: enso-ctl writes
    this file from the config, so the config is the one place to change them.
  -->
  <include ignore_missing="yes">~/.local/state/enso/fonts.conf</include>

  <!--
    Then Adwaita, for what Google Sans does not draw: arrows and symbols,
    and scripts beyond Latin, Greek, and Cyrillic.
  -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Adwaita Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Adwaita Mono</family></prefer>
  </alias>
</fontconfig>
