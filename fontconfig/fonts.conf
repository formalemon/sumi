<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts. Programs that ask for a kind of font rather than a font by name —
  Alacritty, Firefox, most of GTK — are given the ones enso draws with:
  Adwaita Sans and Adwaita Mono, with Symbols Nerd Font close behind for the
  glyphs (the prompt's branch, enso's icons). Without this they fall to GNU
  FreeFont, the first match on this machine.
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Adwaita Sans</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Adwaita Mono</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
